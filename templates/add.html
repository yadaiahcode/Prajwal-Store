{% extends "base.html" %}
{% load static %}
{% block content %}
    <title>Add Product</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="header">
    <div class="logo">
        <h2>📚 Prajwal Stationery</h2>
        <p>Stationery & Xerox Management</p>
    </div>

   <nav class="navbar">
            <a href="{% url 'home' %}">Dashboard</a>
            <a href="{% url 'product' %}">Products</a>
            <a href="{% url 'list' %}">List Product</a>
        </nav>
</header>
<main class="container">

    <h1>Add New Product</h1>
    <p class="subtitle">Enter product information below</p>

    <div class="form-container">

        <form method="POST"  enctype="multipart/form-data" >
            {% csrf_token %}
            <label>Product Name</label>
            <input type="text" name="product_name" placeholder="Enter product " required>

            <label>Price</label>
            <input type="number" name="price" placeholder="Enter purchase price" required>

            <label>Quantity</label>
            <input type="number" name="quantity" placeholder="Enter quantity" reqiured>

            <label>Description</label>
            <textarea rows="4" name="description" placeholder="Enter product description">{{description}}</textarea>

            <label>Product Image</label>
            <input type="file" name="image">

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <a href="{% url 'product' %}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>

    </div>

</main>

<footer class="footer">
    <p>© 2026 Prajwal Stationery & Xerox</p>
</footer>
{% endblock  %}
